<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Monochrome notification badge: Android shows only its shape, tinted white. Bold and
       edge-to-edge so it reads at status-bar size. Mirrors the app icon's two shelves. -->
  <defs>
    <mask id="m">
      <rect width="96" height="96" fill="#fff"/>
      <!-- checks cut out of the two big boxes -->
      <path d="M14 24 l7 7 13 -15" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M40 71 l7 7 13 -15" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g fill="#fff" mask="url(#m)">
    <!-- top shelf: big checked box, then two small boxes -->
    <rect x="4" y="4" width="40" height="36" rx="8"/>
    <rect x="50" y="18" width="18" height="22" rx="5"/>
    <rect x="73" y="10" width="19" height="30" rx="5"/>
    <rect x="2" y="42" width="92" height="7" rx="3.5"/>
    <!-- bottom shelf: small box, big checked box, small box -->
    <rect x="4" y="62" width="18" height="24" rx="5"/>
    <rect x="28" y="54" width="44" height="32" rx="8"/>
    <rect x="77" y="66" width="15" height="20" rx="5"/>
    <rect x="2" y="88" width="92" height="7" rx="3.5"/>
  </g>
</svg>
