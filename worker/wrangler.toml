# Fridgeboard push relay. Free Cloudflare Workers plan.
# Deploy:  cd worker && npx wrangler@4 deploy
# Secret:  npx wrangler@4 secret put VAPID_PRIVATE_KEY
name = "fridgeboard-push"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
FIREBASE_PROJECT_ID = "fridgeboard-642b9"
ALLOWED_ORIGINS = "https://fridgeboard-642b9.web.app,https://fridgeboard-642b9.firebaseapp.com"
VAPID_SUBJECT = "mailto:you@example.com"
# Public half of the key pair from `npm run vapid` (safe to commit).
VAPID_PUBLIC_KEY = ""
